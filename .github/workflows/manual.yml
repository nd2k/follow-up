name: Keep Render backend awake

on:
  schedule:
    - cron: '*/13 * * * *'
  workflow_dispatch: # trigger automatically a call

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://follow-up-cciu.onrender.com//health)
          if [ "$response" != "200" ]; then
            echo "Réponse inattendue : $response"
            exit 1
          fi
          echo "Wake up call, status $response"
