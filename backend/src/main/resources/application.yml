spring:
  application:
    name: follow-up

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 18000000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN}
  security:
    jwt-secret: ${JWT_SECRET}
  seed:
    user1-email: ${USER1_EMAIL}
    user1-password: ${USER1_PASSWORD}
    user1-name: ${USER1_NAME}
    user2-email: ${USER2_EMAIL}
    user2-password: ${USER2_PASSWORD}
    user2-name: ${USER2_NAME}
